name: 'OHOS Base (aarch64)'

# Runs only on demand or on pushes to harmonyos-port. pull_request is
# intentionally absent so untrusted/fork PRs never reach the self-hosted
# runner that holds the DevEco/HarmonyOS toolchain.
on:
  workflow_dispatch:
  push:
    branches: [ harmonyos-port ]

permissions:
  contents: read

jobs:
  build:
    name: Rebol3 Base for aarch64-linux-ohos
    # Self-hosted Windows runner with WSL, DevEco Studio and the HarmonyOS/
    # OpenHarmony SDK (BiSheng clang). See make/ohos-build.sh for the toolchain
    # paths, which can be overridden with DEVECO_WSL / DEVECO_WIN.
    # A Rebol3 (3.6+) interpreter is required for pre-make; set the repository
    # variable OHOS_HOST_R3 to its (WSL) path, or have `r3` on PATH.
    runs-on: [ self-hosted, Windows ]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # make/ohos-build.sh must run inside WSL: it drives the Windows DevEco
      # cross-toolchain through interop and uses wslpath. It regenerates the
      # gitignored Rebol generated sources, compiles the 117 Base translation
      # units, and links both binaries with -Wl,--no-undefined.
      - name: Build OHOS Base via WSL
        shell: powershell
        env:
          HOST_R3: ${{ vars.OHOS_HOST_R3 }}
        run: |
          $hostR3 = if ($env:HOST_R3) { $env:HOST_R3 } else { 'r3' }
          $script = (Get-Item -LiteralPath 'make/ohos-build.sh').FullName
          $wslScript = ((& wsl.exe wslpath -a "$script") | Out-String).Trim()
          Write-Host "Script (WSL): $wslScript"
          Write-Host "HOST_R3: $hostR3"
          & wsl.exe bash -lc "export HOST_R3='$hostR3'; bash '$wslScript'"
          exit $LASTEXITCODE

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: rebol3-ohos-arm64
          path: |
            build-ohos/librebol-core-ohos.so
            build-ohos/rebol3-ohos
          if-no-files-found: error
          retention-days: 14
