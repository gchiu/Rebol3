name: 'OHOS Base (aarch64)'

# Runs only on demand or on pushes to harmonyos-port.
# pull_request is deliberately absent so untrusted PRs never
# execute on the self-hosted machine.
on:
  workflow_dispatch:
  push:
    branches: [ harmonyos-port ]

permissions:
  contents: read

jobs:
  build:
    name: Rebol3 Base for aarch64-linux-ohos

    # Self-hosted Windows runner with:
    # - WSL
    # - DevEco Studio
    # - HarmonyOS/OpenHarmony SDK
    # - BiSheng clang
    #
    # OHOS_HOST_R3 should contain the WSL path to a Rebol3
    # interpreter used only for the pre-make generation step.
    runs-on: [ self-hosted, Windows ]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build OHOS Base via WSL
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          HOST_R3: ${{ vars.OHOS_HOST_R3 }}
        run: |
          $hostR3 = if ($env:HOST_R3) { $env:HOST_R3 } else { 'r3' }

          $script = (Get-Item -LiteralPath 'make/ohos-build.sh').FullName

          # Convert:
          # D:\actions-runner\_work\Rebol3\Rebol3\make\ohos-build.sh
          #
          # to:
          # /mnt/d/actions-runner/_work/Rebol3/Rebol3/make/ohos-build.sh

          $drive = $script.Substring(0, 1).ToLower()
          $rest = $script.Substring(2).Replace('\', '/')
          $wslScript = "/mnt/${drive}${rest}"

          Write-Host "Script (Windows): $script"
          Write-Host "Script (WSL):     $wslScript"
          Write-Host "HOST_R3:          $hostR3"

          & wsl.exe bash -lc "export HOST_R3='$hostR3'; bash '$wslScript'"
          exit $LASTEXITCODE

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: rebol3-ohos-arm64
          path: |
            build-ohos/librebol-core-ohos.so
            build-ohos/rebol3-ohos
          if-no-files-found: error
          retention-days: 14